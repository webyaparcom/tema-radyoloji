  .modulex-sayac-sira { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }

  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-sira :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-sira :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-sira :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-sira img { display: block; max-width: 100%; }

  .modulex-sayac-sira-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-sira-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-sira-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }

  .modulex-sayac-sira-liste { display: grid; border-block-start: 1px solid --cizgi--; }
  .modulex-sayac-sira-satir { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: clamp(14px, 3vw, 36px); padding: 22px clamp(8px, 2vw, 20px); border-block-end: 1px solid --cizgi--; transition: background 0.3s ease, color 0.3s ease; }
  .modulex-sayac-sira-satir:hover { background: --vurguBg--; color: --vurguText--; }
  .modulex-sayac-sira-satir:hover .modulex-sayac-sira-no, .modulex-sayac-sira-satir:hover .modulex-sayac-sira-not, .modulex-sayac-sira-satir:hover .modulex-sayac-sira-ek { color: inherit; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-sira :is(.modulex-sayac-sira-baslik, .modulex-sayac-sira-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-sira-baslik { line-height: 1.35; }

  @media (max-width: 768px) {
    .modulex-sayac-sira { padding-inline: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-sira *, .modulex-sayac-sira *::before, .modulex-sayac-sira *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-sira";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sayac(s, P, az);
    });
  })();
</script>
