  .modulex-ekip-bolum-sekme-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-ekip-bolum-sekme-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ekip-bolum-sekme-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ekip-bolum-sekme-dugme:hover { transform: translateY(-2px); }

  .modulex-ekip-bolum-sekme:not(.modulex-ekip-bolum-sekme--js) .modulex-ekip-bolum-sekme-sekmeler { display: none; }
  .modulex-ekip-bolum-sekme:not(.modulex-ekip-bolum-sekme--js) .modulex-ekip-bolum-sekme-duzen { grid-template-columns: minmax(0, 1fr); }
  .modulex-ekip-bolum-sekme:not(.modulex-ekip-bolum-sekme--js) .modulex-ekip-bolum-sekme-panel:not(:first-child) { display: none; }
  .modulex-ekip-bolum-sekme-sekme { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 48px; padding: 10px 16px; border: 0; border-inline-start: 3px solid transparent; border-radius: 0; border-start-end-radius: 10px; border-end-end-radius: 10px; background: transparent; color: --text--; font: inherit; font-weight: 650; text-align: start; transition: background-color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-bolum-sekme-sekme:hover { background-color: --bg--; }
  .modulex-ekip-bolum-sekme-sekme[aria-selected="true"] { border-inline-start-color: --accent--; background-color: --bg--; }
  .modulex-ekip-bolum-sekme-sayi { min-width: 28px; padding: 2px 8px; border-radius: 999px; background-color: --kartBg--; color: --text--; font-size: 0.8rem; text-align: center; }
  .modulex-ekip-bolum-sekme-liste { display: grid; gap: 10px; }
  .modulex-ekip-bolum-sekme-panel { animation: modulex-ekip-bolum-sekme-gel 0.35s ease both; }
  .modulex-ekip-bolum-sekme-uye { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 14px 18px; border-radius: --yuvarlak--; background-color: --bg--; transition: transform 0.25s ease; }
  .modulex-ekip-bolum-sekme-uye:hover { transform: translateX(4px); }
  .modulex-ekip-bolum-sekme-foto { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; font-size: 1.2rem; }
  .modulex-ekip-bolum-sekme-yazi { display: grid; gap: 2px; }
  .modulex-ekip-bolum-sekme-bio { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.9rem; }
  @keyframes modulex-ekip-bolum-sekme-gel { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-ekip-bolum-sekme-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-ekip-bolum-sekme-sekmeler { position: static; display: flex; overflow-x: auto; scrollbar-width: none; }
    .modulex-ekip-bolum-sekme-sekme { flex: 0 0 auto; border-inline-start: 0; border-block-end: 3px solid transparent; border-radius: 10px 10px 0 0; border-start-end-radius: 10px; border-end-end-radius: 0; }
    .modulex-ekip-bolum-sekme-sekme[aria-selected="true"] { border-block-end-color: --accent--; }
    .modulex-ekip-bolum-sekme-uye { grid-template-columns: auto minmax(0, 1fr); }
    .modulex-ekip-bolum-sekme-uye .modulex-ekip-bolum-sekme-sosyal { grid-column: 1 / -1; }
  }
  /* img width/height öznitelikleri CSS yüksekliği olur — aspect-ratio'nun çalışması için yükseklik auto (modül kuralı ezebilir) */
  :where(.modulex-ekip-bolum-sekme) img { height: auto; }
  .modulex-ekip-bolum-sekme-foto { min-width: 0; }
  .modulex-ekip-bolum-sekme-bag { color: inherit; text-decoration: none; }
  .modulex-ekip-bolum-sekme-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-ekip-bolum-sekme-harf { display: grid; place-items: center; background-color: --vurguBg--; color: --vurguText--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-ekip-bolum-sekme-sosyal { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-ekip-bolum-sekme-slink { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 40px; padding: 0 10px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-size: 0.88rem; text-decoration: none; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-bolum-sekme-slink:hover { background-color: --accent--; border-color: --accent--; color: --accentText--; }
  .modulex-ekip-bolum-sekme-slink .material-symbols-outlined { font-size: 19px; }
  .modulex-ekip-bolum-sekme-syazi { overflow-wrap: anywhere; }
  .modulex-ekip-bolum-sekme-ad { font-size: 1.12rem; font-weight: 750; line-height: 1.3; }
  .modulex-ekip-bolum-sekme-unvan { color: --accentInk--; font-size: 0.92rem; font-weight: 650; }
  .modulex-ekip-bolum-sekme-bio { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-ekip-bolum-sekme-bolum { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-bolum-sekme :is(.modulex-ekip-bolum-sekme-baslik, .modulex-ekip-bolum-sekme-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-bolum-sekme-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ekip-bolum-sekme { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ekip-bolum-sekme *, .modulex-ekip-bolum-sekme *::before, .modulex-ekip-bolum-sekme *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ekip-bolum-sekme";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
